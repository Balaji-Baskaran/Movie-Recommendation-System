<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Recommendations</title>
  <meta name="description" content="AI-powered movie recommendation system. Find similar movies using semantic embeddings or browse by genre, year, and language." />
  <link rel="stylesheet" href="/static/css/style.css" />
  <!-- Plotly.js for interactive charts -->
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js" defer></script>
  <!-- TomSelect for fast virtualized dropdowns -->
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
  <!-- Preconnect to TMDB image server to speed up image loads -->
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="dns-prefetch" href="https://image.tmdb.org">
</head>
<body>
<div id="app">

  <!-- ═══════════ NAVBAR ═══════════ -->
  <nav class="navbar">
    <div class="nav-brand">
      <div class="nav-logo">
        <!-- Clapperboard icon -->

        </svg>
      </div>
      <span class="nav-title"></span>
    </div>

    <!-- Dark / Light toggle -->
    <div class="theme-toggle" id="themeToggle" role="button" aria-label="Toggle dark/light mode" tabindex="0">
      <span class="theme-toggle-label" id="themeLabel">Dark Mode</span>
      <div class="toggle-track">
        <div class="toggle-thumb">
          <!-- Moon icon (dark mode) -->
          <svg class="toggle-icon icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <!-- Sun icon (light mode) -->
          <svg class="toggle-icon icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"

            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1"  x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22"  x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3"  y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64"  y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>

        </div>

    </div>
  </nav>

  <!-- ═══════════ HERO ═══════════ -->
  <section class="hero">

    <h1 class="hero-title">Movie Recommendation System</h1>

  </section>

  <!-- ═══════════ TABS ═══════════ -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-btn-search" onclick="switchTab('search')" aria-selected="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"

        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>

    <button class="tab-btn" id="tab-btn-filter" onclick="switchTab('filter')" aria-selected="false">

      </svg>

    </button>

    <div class="search-wrapper">

        <label class="form-label">Genre(s)</label>
        <div class="multi-select" id="ms-genre">

            <span class="multi-select-placeholder" id="ms-genre-label">Choose genres…</span>
            <svg class="multi-select-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"

          <div class="multi-select-dropdown" id="ms-genre-dropdown"></div>
        </div>
      </div>

      <!-- Year multi-select -->
      <div class="form-group">
        <label class="form-label">Year(s)</label>

            <span class="multi-select-placeholder" id="ms-year-label">Choose years…</span>
            <svg class="multi-select-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"

            </svg>
          </button>
          <div class="multi-select-dropdown" id="ms-year-dropdown"></div>
        </div>
      </div>

      <!-- Industry multi-select -->
      <div class="form-group">
        <label class="form-label">Language / Industry</label>
        <div class="multi-select" id="ms-industry">
          <button type="button" class="multi-select-trigger" onclick="toggleDropdown('ms-industry')" id="ms-industry-trigger">
            <span class="multi-select-placeholder" id="ms-industry-label">Choose industries…</span>
            <svg class="multi-select-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>

          <div class="multi-select-dropdown" id="ms-industry-dropdown"></div>
        </div>

      <button type="submit" class="btn-primary" id="filterBtn">

        </svg>
        Find Movies

    </form>

    <!-- Filter spinner -->
    <div class="spinner-wrap" id="filterSpinner">
      <div class="spinner"></div>
      <span>Filtering movies…</span>
    </div>

    <!-- Filter results -->
    <div id="filterResults"></div>

  </div><!-- /panel-filter -->

</div><!-- /#app -->

<!-- ═══════════ JAVASCRIPT ═══════════ -->
<script>
/* ── Helpers ── */
const $ = id => document.getElementById(id);

/* ══════════════════════════════════════
   DARK / LIGHT TOGGLE
══════════════════════════════════════ */
const THEME_KEY = 'cinematch-theme';

function applyTheme(theme) {
  if (theme === 'light') {
    document.body.classList.add('light');
    $('themeLabel').textContent = 'Light Mode';
  } else {
    document.body.classList.remove('light');
    $('themeLabel').textContent = 'Dark Mode';
  }
  localStorage.setItem(THEME_KEY, theme);
}

// Apply saved theme immediately (no flash)
(function() {
  const saved = localStorage.getItem(THEME_KEY) || 'dark';
  applyTheme(saved);
})();

$('themeToggle').addEventListener('click', () => {
  const current = document.body.classList.contains('light') ? 'light' : 'dark';
  applyTheme(current === 'dark' ? 'light' : 'dark');
});

$('themeToggle').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('themeToggle').click(); }
});

/* ══════════════════════════════════════
   TABS
══════════════════════════════════════ */
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.remove('active');
    b.setAttribute('aria-selected', 'false');
  });
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  $(`tab-btn-${name}`).classList.add('active');
  $(`tab-btn-${name}`).setAttribute('aria-selected', 'true');
  $(`panel-${name}`).classList.add('active');
}

/* ══════════════════════════════════════
   ICON SNIPPETS (inline SVG helpers)
══════════════════════════════════════ */
const ICONS = {
  film: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/>
    <line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/>
    <line x1="2" y1="12" x2="22" y2="12"/>
    <line x1="2" y1="7" x2="7" y2="7"/><line x1="17" y1="7" x2="22" y2="7"/>
    <line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/>
  </svg>`,
  star: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
  </svg>`,
  alert: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
    <path d="M12 9v4"/><path d="M12 17h.01"/>
  </svg>`,
  error: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>
  </svg>`,
  sparkles: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3L13.5 8.5L19 10L13.5 11.5L12 17L10.5 11.5L5 10L10.5 8.5Z"/>
    <path d="M19 3L19.5 4.5L21 5L19.5 5.5L19 7L18.5 5.5L17 5L18.5 4.5Z"/>
    <path d="M5 17L5.5 18.5L7 19L5.5 19.5L5 21L4.5 19.5L3 19L4.5 18.5Z"/>
  </svg>`,
  flame: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"

    <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6

    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>

  </svg>`,
  table: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"

function svgIcon(name, size=16, color='currentColor') {
  return ICONS[name]
    ? ICONS[name].replace('<svg ', `<svg style="width:${size}px;height:${size}px;color:${color};vertical-align:middle;flex-shrink:0;" `)
    : '';
}

/* ══════════════════════════════════════
   LOAD MOVIE OPTIONS
══════════════════════════════════════ */
async function loadMovies() {
  try {
    const res = await fetch('/api/movies');
    const data = await res.json();
    
    new TomSelect('#movieSelect', {
      valueField: 'idx',
      labelField: 'label',
      searchField: 'label',
      options: data,
      create: false,
      maxOptions: 50,
      placeholder: 'Select or search a movie title…',
    });
  } catch(e) { console.error('Failed to load movies', e); }
}

/* ══════════════════════════════════════
   LOAD FILTER OPTIONS SEPARATELY
══════════════════════════════════════ */
async function loadFilterOptions() {
  try {
    const res = await fetch('/api/filter-options');
    const data = await res.json();
    populateMultiSelect('ms-genre',    data.genres);
    populateMultiSelect('ms-year',     data.years.map(String));
    populateMultiSelect('ms-industry', data.industries);
  } catch(e) { console.error('Failed to load filter options', e); }
}

/* ══════════════════════════════════════
   MULTI-SELECT COMPONENT
══════════════════════════════════════ */
const msState = {};  // { 'ms-genre': Set() }

function populateMultiSelect(id, options) {
  msState[id] = new Set();
  const dropdown = $(`${id}-dropdown`);
  dropdown.innerHTML = '';
  const frag = document.createDocumentFragment();
  options.forEach(opt => {
    const div = document.createElement('div');
    div.className = 'multi-select-option';
    div.dataset.value = opt;
    div.innerHTML = `
      <div class="option-check">${svgIcon('check',10,'#fff')}</div>
      <span>${opt}</span>
    `;
    div.addEventListener('click', () => toggleOption(id, opt, div));
    frag.appendChild(div);
  });
  dropdown.appendChild(frag);
}

function toggleOption(id, value, el) {
  const set = msState[id];
  if (set.has(value)) { set.delete(value); el.classList.remove('selected'); }
  else                { set.add(value);    el.classList.add('selected'); }
  updateTriggerLabel(id);
}

function updateTriggerLabel(id) {
  const set = msState[id];
  const labelEl = $(`${id}-label`);
  if (set.size === 0) {
    const placeholders = { 'ms-genre':'Choose genres…','ms-year':'Choose years…','ms-industry':'Choose industries…' };
    labelEl.className = 'multi-select-placeholder';
    labelEl.textContent = placeholders[id] || 'Choose…';
  } else {
    labelEl.className = '';
    const items = [...set];
    labelEl.textContent = items.length <= 2 ? items.join(', ') : `${items.length} selected`;
  }
}

function toggleDropdown(id) {
  const trigger  = $(`${id}-trigger`);
  const dropdown = $(`${id}-dropdown`);
  const isOpen = dropdown.classList.contains('open');
  // Close all
  document.querySelectorAll('.multi-select-dropdown.open').forEach(d => d.classList.remove('open'));
  document.querySelectorAll('.multi-select-trigger.open').forEach(t => t.classList.remove('open'));
  if (!isOpen) {
    dropdown.classList.add('open');
    trigger.classList.add('open');
  }
}

// Close dropdowns on outside click
document.addEventListener('click', e => {
  if (!e.target.closest('.multi-select')) {
    document.querySelectorAll('.multi-select-dropdown.open').forEach(d => d.classList.remove('open'));
    document.querySelectorAll('.multi-select-trigger.open').forEach(t => t.classList.remove('open'));
  }
});

/* ══════════════════════════════════════
   RENDER MOVIE CARD
══════════════════════════════════════ */
function renderMovieCard(r) {
  const indCls = `i-${r.industry}`;
  const genres = (r.genre_list || []).slice(0,2).filter(Boolean)
    .map(g => `<span class="genre-tag">${g.charAt(0).toUpperCase()+g.slice(1)}</span>`).join('');

  let poster = r.poster_path || '';
  let imgHtml, noStyle;
  if (poster.startsWith('http')) {
    const originalPoster = poster.replace('/w500/', '/original/');
    imgHtml  = `<img src="${originalPoster}" alt="${r.title}" loading="eager" decoding="async"/>`;
    noStyle  = '';
  } else {
    imgHtml  = `<div class="no-poster-card">${svgIcon('film',48,'rgba(165,180,252,0.5)')}</div>`;
    noStyle  = 'style="background:none"';
  }

  const simPct   = (r.score || 0) * 100;
  const ov       = (r.overview || '');
  const ovShort  = ov.length > 130 ? ov.slice(0,130)+'…' : ov;
  const year     = r.year || '—';
  const rat      = r.rating ? r.rating.toFixed(1) : '—';

  const simBadge = simPct > 0 ? `<div class="sim-badge">${svgIcon('sparkles',11,'#fff')} ${simPct.toFixed(0)}%</div>` : '';
  const simBar   = simPct > 0 ? `<div class="sim-bar-wrap"><div class="sim-bar-fill" style="width:${simPct.toFixed(1)}%"></div></div>` : '';
  const rankBadge= r.rank    ? `<div class="rank-badge">#${r.rank}</div>` : '';

  return `
<div class="movie-card fade-in">
  <div class="card-poster-wrap" ${noStyle}>
    ${imgHtml}
    <div class="card-poster-overlay"></div>
    ${rankBadge}
    ${simBadge}
  </div>
  <div class="card-body">
    <div class="card-title">${r.title}</div>
    <div class="card-meta">
      <span class="ind-tag ${indCls}">${r.industry}</span>
      <span class="year-tag">${year}</span>
    </div>
    <div class="card-rating">${svgIcon('star',13,'#fbbf24')}&nbsp;<span class="card-rat-val">${rat}</span></div>
    <div class="card-genres">${genres}</div>
    ${simBar}
  </div>
</div>`;
}

/* ══════════════════════════════════════
   RENDER SELECTED MOVIE CARD
══════════════════════════════════════ */
function renderSelectedCard(sm) {
  const poster = sm.poster_path || '';
  let posterHtml;
  if (poster.startsWith('http')) {
    const originalPoster = poster.replace('/w500/', '/original/');
    posterHtml = `<div class="sel-poster"><img src="${originalPoster}" alt="${sm.title}" loading="eager" fetchpriority="high" decoding="async"/></div>`;
  } else {
    posterHtml = `<div class="sel-no-poster">${svgIcon('film',56,'rgba(165,180,252,0.5)')}</div>`;
  }

  const genres = (sm.genre_list || []).filter(Boolean)
    .map(g => `<span class="genre-tag">${g.charAt(0).toUpperCase()+g.slice(1)}</span>`).join('');

  const ov  = sm.overview || 'No overview available.';
  const ovS = ov.length > 400 ? ov.slice(0,400)+'…' : ov;
  const year = sm.year || 0;
  const rat  = sm.rating ? sm.rating.toFixed(1) : '0.0';
  const pop  = sm.popularity ? sm.popularity.toFixed(1) : '0.0';
  const indCls = `i-${sm.industry}`;

  return `
<div class="sel-card fade-in">
  ${posterHtml}
  <div class="sel-info">
    <div class="sel-title">${sm.title}</div>
    <div class="tag-row">
      <span class="ind-tag ${indCls}">${sm.industry}</span>
      <span class="year-tag">${year}</span>
      ${genres}
    </div>
    <div class="star-row">
      ${svgIcon('star',16,'#fbbf24')}
      <span class="star-val">${rat} / 10</span>
      <span style="color:rgba(148,163,184,0.5);font-size:0.8rem;margin:0 4px">·</span>
      <span style="color:var(--text-muted);font-size:0.8rem;display:inline-flex;align-items:center;gap:3px">
        ${svgIcon('flame',14,'#fb923c')} ${pop} popularity
      </span>
    </div>
    <div class="sel-overview">${ovS}</div>
  </div>
</div>`;
}



/* ══════════════════════════════════════
   SEARCH
══════════════════════════════════════ */
async function doSearch() {
  const sel = $('movieSelect');
  const idx = sel.value;
  if (!idx) { return; }

  const spinner = $('searchSpinner');
  const results = $('searchResults');

  spinner.classList.add('show');
  results.innerHTML = '';

  try {
    const res = await fetch('/api/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ movie_idx: parseInt(idx), n: 10 }),
    });
    const data = await res.json();

    if (data.error) {
      results.innerHTML = `<div class="empty-state show"><div class="empty-state-icon">${svgIcon('alert',48,'#fbbf24')}</div><h3>${data.error}</h3></div>`;
      return;
    }

    let html = renderSelectedCard(data.selected);

    // Heartbeat chart section
    html += `
<div class="section-label">
  <span class="accent-bar"></span>
  ${svgIcon('pulse',16,'#818cf8')} Similarity Visualisation
</div>
<div class="chart-container">
  <div id="heartbeatChart" style="width:100%;min-height:460px"></div>
</div>`;

    // Movie cards
    html += `
<div class="section-label" style="margin-top:1rem">
  <span class="accent-bar"></span>
  ${svgIcon('film',16,'#818cf8')} Recommended Movies
</div>
<div class="cards-grid">
  ${data.recommendations.map(renderMovieCard).join('')}
</div>`;



    results.innerHTML = html;

    // Render Plotly chart (after DOM insertion)
    if (data.chart_json) {
      const chartData = JSON.parse(data.chart_json);
      Plotly.newPlot('heartbeatChart', chartData.data, chartData.layout, { displayModeBar: false, responsive: true });
    }

  } catch(e) {
    results.innerHTML = `<div class="empty-state show" style="display: flex; flex-direction: column; align-items: center;"><div class="empty-state-icon" style="margin-bottom: 1rem;">${svgIcon('error',48,'#ef4444')}</div><h3>Error: ${e.message}</h3></div>`;
  } finally {
    spinner.classList.remove('show');
  }
}

/* ══════════════════════════════════════
   FILTER
══════════════════════════════════════ */
async function doFilter(e) {
  e.preventDefault();

  const genres     = [...(msState['ms-genre']    || [])];
  const years      = [...(msState['ms-year']     || [])].map(Number);
  const industries = [...(msState['ms-industry'] || [])];

  const spinner = $('filterSpinner');
  const results = $('filterResults');

  spinner.classList.add('show');
  results.innerHTML = '';

  try {
    const res = await fetch('/api/filter', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ genres, years, industries }),
    });
    const data = await res.json();

    if (data.error || !data.movies || data.movies.length === 0) {
      results.innerHTML = `
<div class="empty-state show" style="display: flex; flex-direction: column; align-items: center;">
  <div class="empty-state-icon" style="margin-bottom: 1rem;">${svgIcon('film',48,'#818cf8')}</div>
  <h3>No movies found</h3>
  <p>Try removing some filters to broaden your search.</p>
</div>`;
      return;
    }

    let html = `
<div class="section-label" style="margin-top:1rem">
  <span class="accent-bar"></span>
  ${svgIcon('film',16,'#818cf8')} Top ${data.movies.length} Matches
</div>
<div class="cards-grid">
  ${data.movies.map(renderMovieCard).join('')}
</div>`;

    results.innerHTML = html;

  } catch(e) {
    results.innerHTML = `<div class="empty-state show" style="display: flex; flex-direction: column; align-items: center;"><div class="empty-state-icon" style="margin-bottom: 1rem;">${svgIcon('error',48,'#ef4444')}</div><h3>Error: ${e.message}</h3></div>`;
  } finally {
    spinner.classList.remove('show');
  }
}

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  loadMovies();
  loadFilterOptions();

  // Allow Enter key on search
  $('movieSelect').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });
});
</script>
